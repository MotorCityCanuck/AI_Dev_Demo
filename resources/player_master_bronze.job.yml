resources:
  jobs:
    player_master_bronze:
      name: player_master_bronze
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_player_master
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../notebooks/ingest_player_master_bronze.py
            base_parameters:
              source_path: ${var.source_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
              table: ${var.table}
              state_volume: ${var.state_volume}
